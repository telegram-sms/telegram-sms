name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openssl curl wget ca-certificates zip unzip

      - name: Set up Android NDK
        run: |
          NDK_VERSION="27.2.12479018"
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: Configure Git
        run: |
          git config --global user.email "ci-bot@telegram-sms.com"
          git config --global user.name "GitHub Actions Bot"

      - name: Generate version information
        run: |
          UBUNTU_VERSION="$(date +%y.%m)"
          RELEASE_TAG="${UBUNTU_VERSION}-${GITHUB_REF_NAME}-${GITHUB_SHA::8}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          VERSION_NAME="${UBUNTU_VERSION}"
          
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          
          echo "Release Tag: ${RELEASE_TAG}"
          echo "Version Code: ${VERSION_CODE}"
          echo "Version Name: ${VERSION_NAME}"

      - name: Setup Gradle
        run: |
          chmod +x ./gradlew
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties << EOF
          org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configureondemand=true
          android.ndkVersion=27.2.12479018
          EOF

      - name: Copy language pack
        run: ./gradlew app:copy_language_pack --no-daemon

      - name: Build APK (Debug)
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Build APK (Release - unsigned)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: ./gradlew clean assembleRelease --stacktrace --no-daemon

      - name: Upload Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: telegram-sms-debug-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: telegram-sms-release-unsigned-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
