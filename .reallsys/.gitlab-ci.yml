# GitLab CI/CD Configuration for Telegram SMS

stages:
    - test
    - build
    - deploy

# ------------------------------------------------------------------------------
# Global Configuration
# ------------------------------------------------------------------------------
default:
    image: alvrme/alpine-android:android-36-jdk21
    timeout: 30m
    interruptible: true

variables:
    OWNER: telegram-sms
    REPO: telegram-sms
    GIT_DEPTH: 0
    GIT_SUBMODULE_STRATEGY: recursive
    GHR_VERSION: "0.17.0"
    BITWARDEN_CLI_VERSION: "2026.7.0"
    GITHUB_API_VERSION: "2026-03-10"
    # Gradle settings
    GRADLE_USER_HOME: "${CI_PROJECT_DIR}/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

# Cache configuration for faster builds
cache:
    key:
        files:
            - app/build.gradle.kts
        prefix: ${CI_PROJECT_ID}
    paths:
        - .gradle/caches/
        - .gradle/wrapper/
    policy: pull-push

# ------------------------------------------------------------------------------
# Job Templates (Hidden jobs for reuse)
# ------------------------------------------------------------------------------
.setup_environment: &setup_environment
    before_script:
        - |
            set -euo pipefail
            echo "==> Installing dependencies..."
            apk --no-cache add git openssl bash curl wget ca-certificates zip unzip nodejs npm build-base python3 jq
            npm install --global "@bitwarden/cli@${BITWARDEN_CLI_VERSION}"
        - |
            echo "==> Downloading keystore from Bitwarden..."
            missing=0
            for v in BW_CLIENTID BW_CLIENTSECRET BW_PASSWORD BW_KEYSTORE_ITEM_ID BW_GITHUB_ITEM_ID; do
              eval "val=\${$v:-}"
              if [ -z "${val}" ]; then
                echo "ERROR: ${v} CI/CD variable is not set"
                missing=1
              fi
            done
            if [ "${missing}" -ne 0 ]; then
              echo "Set the missing variables under Settings → CI/CD → Variables (Protected + Masked)."
              exit 1
            fi

            # Keep Bitwarden state outside the checkout and remove the authenticated
            # session even if downloading the attachment fails.
            export BITWARDENCLI_APPDATA_DIR
            BITWARDENCLI_APPDATA_DIR="$(mktemp -d)"
            cleanup_bitwarden() {
              bw logout > /dev/null 2>&1 || true
              unset BW_SESSION
            }
            trap cleanup_bitwarden EXIT

            if [ -n "${BW_SERVER_URL:-}" ]; then
              bw config server "${BW_SERVER_URL}" > /dev/null
            fi
            bw login --apikey > /dev/null
            BW_SESSION="$(bw unlock --passwordenv BW_PASSWORD --raw)"
            export BW_SESSION
            bw sync > /dev/null
            bw get attachment "${BW_KEYSTORE_ATTACHMENT:-keys.jks}" \
              --itemid "${BW_KEYSTORE_ITEM_ID}" \
              --output "${CI_PROJECT_DIR}/app/keys.jks" > /dev/null

            if [ ! -s app/keys.jks ]; then
              echo "ERROR: Bitwarden returned an empty keystore attachment"
              exit 1
            fi

            # The signing passwords live as custom fields on the same Bitwarden item as the
            # keystore, so rotating the keystore and its passwords is one edit in one place.
            #
            # NOTE: unlike GitLab CI variables, values fetched at runtime are NOT masked in
            # the job log. Never echo them, and never turn on `set -x` in a job that has
            # them exported.
            bw_field() {
              printf '%s' "${bw_item_json}" | jq -r --arg n "$1" \
                '(.fields // []) | map(select(.name == $n)) | .[0].value // empty'
            }
            bw_item_json="$(bw get item "${BW_KEYSTORE_ITEM_ID}")"

            missing=0
            for f in KEYSTORE_PASS ALIAS_NAME ALIAS_PASS; do
              eval "export ${f}=\"\$(bw_field "${f}")\""
              eval "val=\${$f}"
              if [ -z "${val}" ]; then
                echo "ERROR: Bitwarden item ${BW_KEYSTORE_ITEM_ID} has no '${f}' field"
                missing=1
              fi
            done
            unset bw_item_json
            if [ "${missing}" -ne 0 ]; then
              echo "Add the missing field(s) to that item as custom fields (hidden type for the passwords)."
              exit 1
            fi
            echo "==> Signing credentials loaded from Bitwarden."

            # The GitHub token is a Login item whose password IS the token, so reading it
            # needs no JSON parsing. That matters because release_publish fetches the same
            # item on a shell runner that has bw but no jq.
            GITHUB_ACCESS_KEY="$(bw get password "${BW_GITHUB_ITEM_ID}")"
            export GITHUB_ACCESS_KEY
            if [ -z "${GITHUB_ACCESS_KEY}" ]; then
              echo "ERROR: Bitwarden item ${BW_GITHUB_ITEM_ID} has no password set"
              exit 1
            fi
            echo "==> GitHub token loaded from Bitwarden."

            cleanup_bitwarden
            trap - EXIT
        - |
            echo "==> Setting up Gradle..."
            mkdir -p "${GRADLE_USER_HOME}"
            cat >> "${GRADLE_USER_HOME}/gradle.properties" << EOF
            org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError
            org.gradle.parallel=true 
            org.gradle.caching=true
            org.gradle.configureondemand=true
            EOF
            chmod +x ./gradlew
        - |
            echo "==> Generating release tag..."
            if [ "${CI_COMMIT_REF_NAME}" = "master" ]; then
              # Ubuntu-style versioning: YY.MM format with patch number
              UBUNTU_VERSION="$(date +%y.%m)"

              # The GitHub mirror is the release authority. Unlike /releases/latest,
              # the list endpoint includes prereleases, which this project publishes.
              GITHUB_RELEASES_URL="https://api.github.com/repos/${OWNER}/${REPO}/releases?per_page=100"
              if [ -n "${GITHUB_ACCESS_KEY:-}" ]; then
                RELEASES_JSON="$(curl --fail --silent --show-error --retry 3 \
                  -H 'Accept: application/vnd.github+json' \
                  -H "Authorization: Bearer ${GITHUB_ACCESS_KEY}" \
                  -H "X-GitHub-Api-Version: ${GITHUB_API_VERSION}" \
                  "${GITHUB_RELEASES_URL}")"
              else
                RELEASES_JSON="$(curl --fail --silent --show-error --retry 3 \
                  -H 'Accept: application/vnd.github+json' \
                  -H "X-GitHub-Api-Version: ${GITHUB_API_VERSION}" \
                  "${GITHUB_RELEASES_URL}")"
              fi
              export PREVIOUS_RELEASE_TAG="${CHANGELOG_BASE_TAG:-$(
                printf '%s' "${RELEASES_JSON}" \
                  | jq -r '[.[]
                      | select(.draft == false and .published_at != null)
                      | select(.tag_name | test("^[0-9]{2}\\.[0-9]{2}(\\.[0-9]+)?$"))]
                    | sort_by(.published_at)
                    | reverse
                    | .[0].tag_name // empty'
              )}"
              if [ -z "${PREVIOUS_RELEASE_TAG}" ]; then
                echo "ERROR: GitHub has no published YY.MM[.N] release to use as the changelog base"
                echo "Set CHANGELOG_BASE_TAG once to bootstrap a new release history."
                exit 1
              fi
              echo "Previous GitHub release: ${PREVIOUS_RELEASE_TAG}"

              # Releases are created in the GitHub mirror, so GitLab's local tags are
              # not authoritative. Query the mirror directly before choosing a tag.
              if ! REMOTE_TAG_REFS="$(git ls-remote --tags --refs \
                "https://github.com/${OWNER}/${REPO}.git" \
                "refs/tags/${UBUNTU_VERSION}" \
                "refs/tags/${UBUNTU_VERSION}.*")"; then
                echo "ERROR: Could not query existing release tags from GitHub"
                exit 1
              fi
              EXISTING_TAGS="$(printf '%s\n' "${REMOTE_TAG_REFS}" \
                | awk -F/ '{print $3}' \
                | grep -E "^${UBUNTU_VERSION}(\.[0-9]+)?$" || true)"

              # Find the highest patch number for this month.
              PATCH_NUM=0
              if [ -n "${EXISTING_TAGS}" ]; then
                for tag in ${EXISTING_TAGS}; do
                  # Extract patch number if exists (e.g., 26.01.1 -> 1)
                  if echo "${tag}" | grep -qE "^${UBUNTU_VERSION}\.[0-9]+$"; then
                    CURRENT_PATCH=$(echo "${tag}" | sed "s/${UBUNTU_VERSION}\.//")
                    if [ "${CURRENT_PATCH}" -ge "${PATCH_NUM}" ]; then
                      PATCH_NUM=$((CURRENT_PATCH + 1))
                    fi
                  elif [ "${tag}" = "${UBUNTU_VERSION}" ]; then
                    # Base version exists, start with .1
                    if [ "${PATCH_NUM}" -eq 0 ]; then
                      PATCH_NUM=1
                    fi
                  fi
                done
              fi
            
              # Generate final version
              if [ "${PATCH_NUM}" -gt 0 ]; then
                export RELEASE_TAG="${UBUNTU_VERSION}.${PATCH_NUM}"
                export VERSION_NAME="${UBUNTU_VERSION}.${PATCH_NUM}"
              else
                export RELEASE_TAG="${UBUNTU_VERSION}"
                export VERSION_NAME="${UBUNTU_VERSION}"
              fi
              export VERSION_CODE="${CI_PIPELINE_ID}"
            else
              # Nightly or other branches: timestamp-based
              export RELEASE_TAG="$(date +%Y%m%d%H%M)-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}"
              export VERSION_CODE="${CI_PIPELINE_ID}"
              export VERSION_NAME="${RELEASE_TAG}"
            fi
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Version Code: ${VERSION_CODE}"

.build_apk:
    script:
        - |
            echo "==> Building APK..."
            ./gradlew clean assembleRelease --no-daemon --stacktrace


# ------------------------------------------------------------------------------
# Nightly Build Job
# ------------------------------------------------------------------------------
build_nightly:
    stage: build
    retry:
        max: 2
        when:
            - runner_system_failure
            - stuck_or_timeout_failure
            - script_failure
    rules:
        -   if: $CI_COMMIT_BRANCH == "nightly"
    <<: *setup_environment
    script:
        - !reference [ .build_apk, script ]
        - |
            echo "==> Validating GitHub credentials..."
            if [ -z "${GITHUB_ACCESS_KEY:-}" ]; then
              echo "ERROR: GITHUB_ACCESS_KEY was not loaded from Bitwarden item ${BW_GITHUB_ITEM_ID:-<unset>}"
              exit 1
            fi
        - |
            echo "==> Downloading ghr..."
            GHR_URL="https://github.com/tcnksm/ghr/releases/download/v${GHR_VERSION}/ghr_v${GHR_VERSION}_linux_amd64.tar.gz"
            wget -q --retry-connrefused --waitretry=5 --timeout=30 -t 3 "${GHR_URL}" -O ghr.tar.gz
            tar -xzf ghr.tar.gz
            GHR_BIN="./ghr_v${GHR_VERSION}_linux_amd64/ghr"
            chmod +x "${GHR_BIN}"
        - |
            echo "==> Syncing to GitHub..."
            # Use force push to ensure nightly branch sync succeeds even if remote has diverged.
            # --force-with-lease is safer than --force because it prevents overwriting remote changes
            # unless the remote branch hasn't changed since we last fetched.
            git push --force-with-lease --set-upstream "https://${GITHUB_ACCESS_KEY}@github.com/${OWNER}/${REPO}-nightly.git" \
              "HEAD:refs/heads/${CI_COMMIT_REF_NAME}" || {
                echo "WARNING: Failed to push to GitHub, continuing with release..."
              }
        - |
            echo "==> Creating GitHub pre-release..."
            "${GHR_BIN}" \
              -t "${GITHUB_ACCESS_KEY}" \
              -u "${OWNER}" \
              -r "${REPO}-nightly" \
              -c "nightly" \
              -n "${RELEASE_TAG}" \
              -generatenotes \
              "${RELEASE_TAG}" \
              "./app/build/outputs/apk/release/"

# ------------------------------------------------------------------------------
# Release Build Job
# ------------------------------------------------------------------------------
build_release:
    stage: build
    retry:
        max: 2
        when:
            - runner_system_failure
            - stuck_or_timeout_failure
    rules:
        -   if: $CI_COMMIT_BRANCH == "master"
    <<: *setup_environment
    script:
        - |
            echo "==> Validating keystore for release build..."
            if [ ! -f app/keys.jks ]; then
              echo "ERROR: Keystore file not found at app/keys.jks"
              exit 1
            fi
            # These are exported by .setup_environment from the Bitwarden item's custom
            # fields, not from CI/CD variables. Reaching here empty means the job template
            # did not run or the item lost a field.
            missing=0
            for v in KEYSTORE_PASS ALIAS_NAME ALIAS_PASS; do
              eval "val=\${$v:-}"
              if [ -z "${val}" ]; then
                echo "ERROR: ${v} was not loaded from Bitwarden"
                missing=1
              fi
            done
            if [ "${missing}" -ne 0 ]; then
              echo "Check the custom fields on Bitwarden item ${BW_KEYSTORE_ITEM_ID}."
              exit 1
            fi

            # Verify keystore is valid and not corrupted
            if ! keytool -list -keystore app/keys.jks -storepass "${KEYSTORE_PASS}" > /dev/null 2>&1; then
              echo "ERROR: Keystore validation failed - file may be corrupted or KEYSTORE_PASS incorrect"
              exit 1
            fi

            echo "✓ Keystore validation passed"
        - |
            echo "==> Copying language pack..."
            ./gradlew app:copy_language_pack --no-daemon
        - !reference [ .build_apk, script ]
        - |
            echo "==> Validating GitHub credentials..."
            if [ -z "${GITHUB_ACCESS_KEY:-}" ]; then
              echo "ERROR: GITHUB_ACCESS_KEY was not loaded from Bitwarden item ${BW_GITHUB_ITEM_ID:-<unset>}"
              exit 1
            fi
        - |
            echo "==> Syncing to GitHub..."
            GITHUB_URL="https://${GITHUB_ACCESS_KEY}@github.com/${OWNER}/${REPO}.git"

            # Identity for any merge commit produced by the divergence handler below
            git config user.email "${GIT_AUTHOR_EMAIL:-ci@telegram-sms.local}"
            git config user.name "${GIT_AUTHOR_NAME:-GitLab CI}"

            # GitHub master is a protected branch — force-push is rejected. If GitHub
            # has commits we don't have (e.g. README edits made directly on GitHub),
            # the plain push below would be rejected as non-fast-forward. Detect that
            # case and merge GitHub's changes in with -X ours (GitLab content wins on
            # conflict) so our push remains a fast-forward.
            if git fetch "${GITHUB_URL}" "+refs/heads/${CI_COMMIT_REF_NAME}:refs/remotes/github_sync/${CI_COMMIT_REF_NAME}"; then
              GH_REF="refs/remotes/github_sync/${CI_COMMIT_REF_NAME}"
              GH_AHEAD=$(git rev-list --count "HEAD..${GH_REF}" 2>/dev/null || echo 0)
              if [ "${GH_AHEAD}" -gt 0 ]; then
                echo "GitHub has ${GH_AHEAD} commit(s) ahead of local; merging with -X ours..."
                git merge -X ours --no-ff "${GH_REF}" \
                  -m "Sync GitHub master mirror (keep GitLab content) [skip ci]"

                # Push the merge back to GitLab so future CI runs see a linear history.
                # Requires GITLAB_PUSH_TOKEN — a Personal Access Token with
                # `write_repository` scope from a user allowed to push to the protected
                # master branch (Settings → Repository → Protected branches).
                if [ -n "${GITLAB_PUSH_TOKEN:-}" ]; then
                  GITLAB_PUSH_URL="https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
                  echo "Pushing merge commit back to GitLab origin..."
                  git push "${GITLAB_PUSH_URL}" "HEAD:refs/heads/${CI_COMMIT_REF_NAME}" || {
                    echo "WARNING: Could not push merge commit to GitLab origin"
                  }
                else
                  echo "WARNING: GITLAB_PUSH_TOKEN not set — merge commit only in this CI run."
                  echo "         Next run will re-detect divergence and merge again."
                  echo "         Set a PAT (write_repository) as GITLAB_PUSH_TOKEN to fix this."
                fi
              else
                echo "GitHub master is at or behind local; no merge needed"
              fi
            else
              echo "INFO: Could not fetch from GitHub (branch may not exist yet)"
            fi

            echo "==> Pushing to GitHub..."
            git push --set-upstream "${GITHUB_URL}" "HEAD:refs/heads/${CI_COMMIT_REF_NAME}" || {
                echo "WARNING: Failed to push to GitHub, continuing with release..."
              }
        - |
            echo "==> Saving release metadata for downstream job..."
            cat > release.env <<EOF
            RELEASE_TAG=${RELEASE_TAG}
            VERSION_NAME=${VERSION_NAME}
            VERSION_CODE=${VERSION_CODE}
            PREVIOUS_RELEASE_TAG=${PREVIOUS_RELEASE_TAG}
            EOF
            cat release.env
    artifacts:
        name: "telegram-sms-release-${CI_COMMIT_SHORT_SHA}"
        paths:
            - app/build/outputs/apk/release/
        reports:
            dotenv: release.env
        expire_in: 1 week

# ------------------------------------------------------------------------------
# Release Publish Job (gemini-tagged shell runner)
# ------------------------------------------------------------------------------
release_publish:
    stage: deploy
    tags:
      - ai
    retry:
        max: 2
        when:
            - runner_system_failure
            - stuck_or_timeout_failure
    rules:
        -   if: $CI_COMMIT_BRANCH == "master"
    needs:
        -   job: build_release
            artifacts: true
    cache: {}
    variables:
        GIT_STRATEGY: clone
    before_script:
        - set -euo pipefail
        # opencode is installed under the gitlab-runner user's ~/.local/bin, which a
        # non-login CI shell does not include on PATH; add it explicitly.
        - export PATH="/home/gitlab-runner/.local/bin:$PATH"
        - export PATH="/home/gitlab-runner/.opencode/bin:$PATH"
        - |
            echo "==> Loading GitHub token from Bitwarden..."
            missing=0
            for v in BW_CLIENTID BW_CLIENTSECRET BW_PASSWORD BW_GITHUB_ITEM_ID; do
              eval "val=\${$v:-}"
              if [ -z "${val}" ]; then
                echo "ERROR: ${v} CI/CD variable is not set"
                missing=1
              fi
            done
            if [ "${missing}" -ne 0 ]; then
              echo "Set the missing variables under Settings → CI/CD → Variables (Protected + Masked)."
              exit 1
            fi
            if ! command -v bw > /dev/null 2>&1; then
              echo "ERROR: the Bitwarden CLI is not on PATH on this runner."
              echo "Install it for the gitlab-runner user into ~/.local/bin (already on PATH above)."
              exit 1
            fi

            # This is a shell executor, so its state outlives the job. Keep the Bitwarden
            # session in a throwaway appdata dir and log out even if the fetch fails,
            # rather than leaving an authenticated CLI behind on the host.
            export BITWARDENCLI_APPDATA_DIR
            BITWARDENCLI_APPDATA_DIR="$(mktemp -d)"
            cleanup_bitwarden() {
              bw logout > /dev/null 2>&1 || true
              unset BW_SESSION
              rm -rf "${BITWARDENCLI_APPDATA_DIR}"
            }
            trap cleanup_bitwarden EXIT

            if [ -n "${BW_SERVER_URL:-}" ]; then
              bw config server "${BW_SERVER_URL}" > /dev/null
            fi
            bw login --apikey > /dev/null
            BW_SESSION="$(bw unlock --passwordenv BW_PASSWORD --raw)"
            export BW_SESSION
            bw sync > /dev/null

            # A Login item whose password IS the token: no JSON parsing, so this works
            # here even though jq is not installed on this runner.
            #
            # NOTE: unlike a CI/CD variable this value is not masked in the job log.
            # Nothing may echo it, and `set -x` must stay off in this job.
            GITHUB_ACCESS_KEY="$(bw get password "${BW_GITHUB_ITEM_ID}")"
            export GITHUB_ACCESS_KEY
            if [ -z "${GITHUB_ACCESS_KEY}" ]; then
              echo "ERROR: Bitwarden item ${BW_GITHUB_ITEM_ID} has no password set"
              exit 1
            fi

            cleanup_bitwarden
            trap - EXIT
            echo "==> GitHub token loaded from Bitwarden."
    script:
        - |
            echo "==> Validating credentials..."
            if [ -z "${GITHUB_ACCESS_KEY:-}" ]; then
              echo "ERROR: GITHUB_ACCESS_KEY was not loaded from Bitwarden item ${BW_GITHUB_ITEM_ID:-<unset>}"
              exit 1
            fi
            if [ -z "${RELEASE_TAG:-}" ]; then
              echo "ERROR: RELEASE_TAG not received from build_release dotenv"
              exit 1
            fi
            if [ -z "${PREVIOUS_RELEASE_TAG:-}" ]; then
              echo "ERROR: PREVIOUS_RELEASE_TAG not received from build_release dotenv"
              exit 1
            fi
            echo "Release tag: ${RELEASE_TAG}"
        - |
            echo "==> Syncing tags from GitHub source repository..."
            git remote add source https://github.com/telegram-sms/telegram-sms 2>/dev/null || \
              git remote set-url source https://github.com/telegram-sms/telegram-sms

            # Wipe local tags so only GitHub release tags are considered.
            git tag -l | while IFS= read -r t; do
              [ -n "${t}" ] && git tag -d "${t}" > /dev/null
            done
            git fetch source --tags --force

            echo "==> Using GitHub release range..."
            echo "Changelog range: ${PREVIOUS_RELEASE_TAG}..${CI_COMMIT_SHA}"

            chmod +x .reallsys/scripts/generate-changelog.sh
            .reallsys/scripts/generate-changelog.sh \
              "${PREVIOUS_RELEASE_TAG}" "${CI_COMMIT_SHA}" CHANGELOG_BODY.md

            echo "==> Generating release summary with opencode CLI..."
            PROMPT="$(cat .reallsys/scripts/changelog-prompt.txt)

            <changelog>
            $(cat CHANGELOG_BODY.md)
            </changelog>"
            opencode run "${PROMPT}" > SUMMARY_EN.txt
            sed -i '/^```/d; /^## Summary[[:space:]]*$/d' SUMMARY_EN.txt
            if [ ! -s SUMMARY_EN.txt ]; then
              echo "ERROR: opencode returned an empty release summary"
              exit 1
            fi

            {
              printf '## Summary\n\n'
              cat SUMMARY_EN.txt
              printf '\n\n'
              cat CHANGELOG_BODY.md
            } > CHANGELOG.md
            echo "==> Generated changelog:"
            cat CHANGELOG.md
            SUMMARY_EN=$(sed '/^[[:space:]]*$/d' SUMMARY_EN.txt)
            if [ -z "${SUMMARY_EN}" ]; then
              echo "ERROR: Could not load generated English summary"
              exit 1
            fi
            echo "EN summary:"
            cat SUMMARY_EN.txt
        - |
            echo "==> Translating summary to Traditional Chinese via opencode..."
            TRANSLATE_PROMPT="You are translating release notes for an Android SMS-to-Telegram app.
            Translate the following short release summary into Traditional Chinese (繁體中文).
            Keep it concise (around 100 characters). Preserve technical terms (Telegram, SMS, APK, MMKV, etc.) in their original form.
            Output ONLY the translated text — no explanations, no quotes, no markdown.

            English summary:
            ${SUMMARY_EN}"

            opencode run "${TRANSLATE_PROMPT}" > SUMMARY_ZH.txt
            if [ ! -s SUMMARY_ZH.txt ]; then
              echo "ERROR: opencode returned empty Chinese summary"
              exit 1
            fi
            echo "ZH summary:"
            cat SUMMARY_ZH.txt
        - |
            echo "==> Downloading ghr..."
            GHR_URL="https://github.com/tcnksm/ghr/releases/download/v${GHR_VERSION}/ghr_v${GHR_VERSION}_linux_amd64.tar.gz"
            curl -sSL --retry 3 --retry-delay 5 -o ghr.tar.gz "${GHR_URL}"
            tar -xzf ghr.tar.gz
            GHR_BIN="./ghr_v${GHR_VERSION}_linux_amd64/ghr"
            chmod +x "${GHR_BIN}"
        - |
            echo "==> Creating GitHub release..."
            "${GHR_BIN}" \
              -t "${GITHUB_ACCESS_KEY}" \
              -u "${OWNER}" \
              -r "${REPO}" \
              -n "${RELEASE_TAG}" \
              -b "$(cat CHANGELOG.md)" \
              -prerelease \
              "${RELEASE_TAG}" \
              "./app/build/outputs/apk/release/"
    artifacts:
        name: "telegram-sms-changelog-${CI_COMMIT_SHORT_SHA}"
        paths:
            - CHANGELOG.md
            - CHANGELOG_BODY.md
            - SUMMARY_EN.txt
            - SUMMARY_ZH.txt
        expire_in: 1 week


# ------------------------------------------------------------------------------
# Telegram Channel Notification (publishes EN + ZH summaries to two channels)
# ------------------------------------------------------------------------------
# Required CI/CD variables (mark Protected + Masked):
#   TELEGRAM_BOT_TOKEN         — bot token from @BotFather
#   TELEGRAM_CHANNEL_ID_EN     — English channel, e.g. @ts_en or -100xxxxxxxxxx
#   TELEGRAM_CHANNEL_ID_ZH     — Chinese channel, e.g. @ts_zh or -100xxxxxxxxxx
telegram_notify:
    stage: deploy
    image: alpine:latest
    rules:
        -   if: $CI_COMMIT_BRANCH == "master"
    needs:
        -   job: build_release
            artifacts: true
        -   job: release_publish
            artifacts: true
    allow_failure: true
    cache: {}
    before_script:
        - set -euo pipefail
        # nodejs/npm are only here for the Bitwarden CLI: the standalone bw binary is
        # built against glibc and will not run on Alpine's musl, so use the npm package.
        - apk --no-cache add bash curl jq nodejs npm
        - npm install --global "@bitwarden/cli@${BITWARDEN_CLI_VERSION}"
        - |
            echo "==> Loading Telegram credentials from Bitwarden..."
            missing=0
            for v in BW_CLIENTID BW_CLIENTSECRET BW_PASSWORD BW_TELEGRAM_ITEM_ID; do
              eval "val=\${$v:-}"
              if [ -z "${val}" ]; then
                echo "ERROR: ${v} CI/CD variable is not set"
                missing=1
              fi
            done
            [ "${missing}" -eq 0 ] || exit 1

            export BITWARDENCLI_APPDATA_DIR
            BITWARDENCLI_APPDATA_DIR="$(mktemp -d)"
            cleanup_bitwarden() {
              bw logout > /dev/null 2>&1 || true
              unset BW_SESSION
            }
            trap cleanup_bitwarden EXIT

            if [ -n "${BW_SERVER_URL:-}" ]; then
              bw config server "${BW_SERVER_URL}" > /dev/null
            fi
            bw login --apikey > /dev/null
            BW_SESSION="$(bw unlock --passwordenv BW_PASSWORD --raw)"
            export BW_SESSION
            bw sync > /dev/null

            # The bot token is the item's password; the two channel ids are custom fields
            # on the same item, so the whole notify configuration rotates in one place.
            #
            # NOTE: unlike CI/CD variables these are not masked in the job log. Nothing may
            # echo the token, and `set -x` must stay off in this job.
            bw_field() {
              printf '%s' "${bw_item_json}" | jq -r --arg n "$1" \
                '(.fields // []) | map(select(.name == $n)) | .[0].value // empty'
            }
            bw_item_json="$(bw get item "${BW_TELEGRAM_ITEM_ID}")"

            TELEGRAM_BOT_TOKEN="$(printf '%s' "${bw_item_json}" | jq -r '.login.password // empty')"
            # Field names as they are spelled in the vault. Note the Chinese channel is
            # "cn" there while the CI variable it feeds has always been named ZH; renaming
            # either side would only move the mismatch, so it is mapped here instead.
            TELEGRAM_CHANNEL_ID_EN="$(bw_field telegram-sms-en)"
            TELEGRAM_CHANNEL_ID_ZH="$(bw_field telegram-sms-cn)"
            export TELEGRAM_BOT_TOKEN TELEGRAM_CHANNEL_ID_EN TELEGRAM_CHANNEL_ID_ZH
            unset bw_item_json

            cleanup_bitwarden
            trap - EXIT
    script:
        - |
            echo "==> Validating Telegram credentials..."
            missing=0
            for v in TELEGRAM_BOT_TOKEN TELEGRAM_CHANNEL_ID_EN TELEGRAM_CHANNEL_ID_ZH; do
              eval "val=\${$v:-}"
              if [ -z "${val}" ]; then
                echo "ERROR: ${v} was not loaded from Bitwarden item ${BW_TELEGRAM_ITEM_ID:-<unset>}"
                missing=1
              fi
            done
            [ "${missing}" -eq 0 ] || exit 1
            if [ -z "${RELEASE_TAG:-}" ]; then
              echo "ERROR: RELEASE_TAG not received from build_release dotenv"
              exit 1
            fi
            echo "Release tag: ${RELEASE_TAG}"
        - |
            echo "==> Loading summaries..."
            if [ ! -s SUMMARY_EN.txt ] || [ ! -s SUMMARY_ZH.txt ]; then
              echo "ERROR: SUMMARY_EN.txt or SUMMARY_ZH.txt missing from release_publish artifacts"
              exit 1
            fi
            SUMMARY_EN=$(cat SUMMARY_EN.txt)
            SUMMARY_ZH=$(cat SUMMARY_ZH.txt)
            echo "EN: ${SUMMARY_EN}"
            echo "ZH: ${SUMMARY_ZH}"
        - |
            echo "==> Locating release APK..."
            APK_FILE=$(ls -1 app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
            if [ -z "${APK_FILE}" ]; then
              echo "ERROR: No APK found under app/build/outputs/apk/release/"
              exit 1
            fi
            APK_NAME=$(basename "${APK_FILE}")
            echo "APK: ${APK_NAME}"
        - |
            echo "==> Building Telegram payloads..."
            RELEASE_URL="https://github.com/${OWNER}/${REPO}/releases/tag/${RELEASE_TAG}"
            APK_URL="https://github.com/${OWNER}/${REPO}/releases/download/${RELEASE_TAG}/${APK_NAME}"

            html_escape() {
              printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
            }
            ESC_TAG=$(html_escape "${RELEASE_TAG}")
            ESC_SUMMARY_EN=$(html_escape "${SUMMARY_EN}")
            ESC_SUMMARY_ZH=$(html_escape "${SUMMARY_ZH}")

            MESSAGE_EN=$(printf '<b>🚀 New Release: %s</b>\n\n%s' "${ESC_TAG}" "${ESC_SUMMARY_EN}")
            MESSAGE_ZH=$(printf '<b>🚀 新版本發佈：%s</b>\n\n%s' "${ESC_TAG}" "${ESC_SUMMARY_ZH}")

            REPLY_MARKUP_EN=$(jq -nc \
              --arg apk_url "${APK_URL}" \
              --arg release_url "${RELEASE_URL}" \
              '{
                inline_keyboard: [[
                  {text: "📥 Download APK", url: $apk_url},
                  {text: "📖 Release Notes", url: $release_url}
                ]]
              }')

            REPLY_MARKUP_ZH=$(jq -nc \
              --arg apk_url "${APK_URL}" \
              --arg release_url "${RELEASE_URL}" \
              '{
                inline_keyboard: [[
                  {text: "📥 下載 APK", url: $apk_url},
                  {text: "📖 發佈說明", url: $release_url}
                ]]
              }')
        - |
            echo "==> Sending to Telegram channels..."
            send_to_channel() {
              local chat_id="$1"
              local message="$2"
              local reply_markup="$3"
              local payload
              payload=$(jq -nc \
                --arg chat_id "${chat_id}" \
                --arg text "${message}" \
                --argjson reply_markup "${reply_markup}" \
                '{
                  chat_id: $chat_id,
                  text: $text,
                  parse_mode: "HTML",
                  disable_web_page_preview: false,
                  reply_markup: $reply_markup
                }')

              local response
              response=$(curl -sS --max-time 30 --retry 3 --retry-delay 5 \
                -X POST \
                -H 'Content-Type: application/json' \
                -d "${payload}" \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage")

              local ok
              ok=$(printf '%s' "${response}" | jq -r '.ok // "false"')
              if [ "${ok}" != "true" ]; then
                echo "ERROR: Telegram API rejected message for ${chat_id}"
                printf '%s\n' "${response}" | jq .
                return 1
              fi
              echo "✓ Sent to ${chat_id}"
            }

            fail=0
            send_to_channel "${TELEGRAM_CHANNEL_ID_EN}" "${MESSAGE_EN}" "${REPLY_MARKUP_EN}" || fail=1
            send_to_channel "${TELEGRAM_CHANNEL_ID_ZH}" "${MESSAGE_ZH}" "${REPLY_MARKUP_ZH}" || fail=1
            exit "${fail}"


# ------------------------------------------------------------------------------
# Unit Tests
# ------------------------------------------------------------------------------
# Gate for everything below. `test` is the first stage, and a job with no `needs:`
# waits for every earlier stage to succeed, so build_release cannot start — and
# therefore release_publish and telegram_notify cannot run — unless this passes.
#
# Also runs on nightly and on merge requests: a gate that only fires on master
# tells you the tests are broken after the change is already on the release branch.
unit_test:
    stage: test
    retry:
        max: 2
        when:
            - runner_system_failure
            - stuck_or_timeout_failure
    rules:
        -   if: $CI_PIPELINE_SOURCE == "merge_request_event"
        -   if: $CI_COMMIT_BRANCH == "master"
        -   if: $CI_COMMIT_BRANCH == "nightly"
        -   if: $CI_PIPELINE_SOURCE == "web"
    # Deliberately NOT *setup_environment: the unit tests run against the debug variant
    # and need no signing keystore, so pulling one from Bitwarden would only make this
    # job fail wherever the BW_* variables are unavailable (a fork's merge request, for
    # one) and would export the signing passwords into a job that has no use for them.
    before_script:
        - |
            echo "==> Setting up Gradle..."
            mkdir -p "${GRADLE_USER_HOME}"
            cat >> "${GRADLE_USER_HOME}/gradle.properties" << EOF
            org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError
            org.gradle.parallel=true
            org.gradle.caching=true
            org.gradle.configureondemand=true
            EOF
            chmod +x ./gradlew
    script:
        - |
            echo "==> Running JVM unit tests..."
            ./gradlew :app:testDebugUnitTest --no-daemon
    artifacts:
        # when: always — the reports are worth most on the run that failed.
        when: always
        expire_in: 1 week
        paths:
            - app/build/reports/tests/
        reports:
            junit:
                - app/build/test-results/test*/TEST-*.xml

# ------------------------------------------------------------------------------
# Manual Debug Build (for testing)
# ------------------------------------------------------------------------------
build_debug:
    stage: build
    rules:
        -   if: $CI_PIPELINE_SOURCE == "web"
            when: manual
    <<: *setup_environment
    script:
        - |
            echo "==> Building Debug APK..."
            ./gradlew assembleDebug --no-daemon
    artifacts:
        name: "telegram-sms-debug-${CI_COMMIT_SHORT_SHA}"
        paths:
            - app/build/outputs/apk/debug/*.apk
        expire_in: 3 days
        when: on_success
    cache:
        policy: pull
