// For getting git information
def getGitBranch() {
    // Prioritize getting the branch name from the GitLab CI environment variable.
    def ciBranch = System.getenv("CI_COMMIT_REF_NAME")
    if (ciBranch != null && !ciBranch.isEmpty()) {
        println "Found CI branch: " + ciBranch
        return ciBranch
    }

    // If not in a CI environment (e.g., locally), fall back to using the git command.
    try {
        def localBranch = 'git rev-parse --abbrev-ref HEAD'.execute().text.trim()
        println "Found local branch: " + localBranch
        return localBranch
    } catch (e) {
        e.printStackTrace()
        println "Could not determine branch, falling back to 'unknown-branch'"
        return "unknown-branch"
    }
}


// Get the branch name before configuring Android, so we can use it directly later.
def currentBranch = getGitBranch()


apply plugin: 'com.android.application'
android {
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.qwe7002.telegram_sms'
        minSdk = 23
        targetSdk = 36
        versionCode = System.getenv("VERSION_CODE") == null ? 1 : System.getenv("VERSION_CODE").toInteger()
        versionName = System.getenv("VERSION_NAME") == null ? "Debug" : System.getenv("VERSION_NAME").toString()

        // Configure resource configurations for resource shrinking
        resourceConfigurations.addAll(['en', 'zh-rCN', 'zh-rTW', 'zh-rHK', 'yue-rCN', 'yue-rHK', 'ja-rJP', 'es-rES', 'ru', 'vi'])
    }
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility = 21
        targetCompatibility = 21
    }

    kotlin {
        jvmToolchain(21)
    }

    androidResources {
        generateLocaleConfig = true
    }

    signingConfigs {
        release {
            def keystoreFile = file("keys.jks")
            if (keystoreFile.exists()) {
                storeFile = keystoreFile
                storePassword = project.hasProperty("KEYSTORE_PASS") ? KEYSTORE_PASS : System.getenv("KEYSTORE_PASS")
                keyAlias = project.hasProperty("ALIAS_NAME") ? ALIAS_NAME : System.getenv("ALIAS_NAME")
                keyPassword = project.hasProperty("ALIAS_PASS") ? ALIAS_PASS : System.getenv("ALIAS_PASS")
                v1SigningEnabled true
                v2SigningEnabled true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled = false
            shrinkResources = false
            if (currentBranch == "nightly") {
                applicationIdSuffix = ".nightly"
            }

            // Only apply signing config if keystore exists
            if (file("keys.jks").exists()) {
                signingConfig = signingConfigs.release
            }
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
        }

        debug {
            minifyEnabled = false
            applicationIdSuffix = ".debug"
        }
    }
    namespace = 'com.qwe7002.telegram_sms'
    buildToolsVersion '36.1.0'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.browser:browser:1.9.0'
